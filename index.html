<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Animated underline effect for input fields */
        .underline-input-container {
            position: relative;
        }

        .underline-input {
            border: none;
            border-bottom: 1px solid #E2E8F0;
            background: transparent;
            border-radius: 0;
            outline: none;
            transition: border-color 0.3s ease;
        }

        /* Focus line accent */
        .input-line {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background-color: #000000;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .underline-input:focus ~ .input-line {
            width: 100%;
            left: 0;
        }

        /* Subtle button hover & press animations */
        .btn-minimal {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-minimal:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .btn-minimal:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen bg-[#FAF9F6] text-neutral-900 flex items-center justify-center p-6 selection:bg-neutral-900 selection:text-white">

    <!-- Centered Form Container -->
    <main class="w-full max-w-sm mx-auto">
        
        <!-- Header -->
        <div class="mb-10 text-center">
            <h1 class="text-2xl font-light tracking-tight text-neutral-900">Welcome back</h1>
            <p class="text-xs text-neutral-400 mt-2 tracking-wide uppercase">Enter your details to sign in</p>
        </div>

        <!-- Login Form -->
        <form id="minimalLoginForm" onsubmit="handleLogin(event)" class="space-y-7">
            
            <!-- Username Input -->
            <div class="underline-input-container">
                <input 
                    type="text" 
                    id="username" 
                    required 
                    autocomplete="username" 
                    placeholder="Username or email"
                    class="underline-input w-full py-2.5 text-sm text-neutral-900 placeholder-neutral-400 font-normal"
                >
                <div class="input-line"></div>
            </div>

            <!-- Password Input -->
            <div class="underline-input-container">
                <input 
                    type="password" 
                    id="password" 
                    required 
                    autocomplete="current-password" 
                    placeholder="Password"
                    class="underline-input w-full py-2.5 text-sm text-neutral-900 placeholder-neutral-400 font-normal"
                >
                <div class="input-line"></div>
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
                <button 
                    type="submit" 
                    class="btn-minimal w-full py-3 px-4 bg-neutral-900 hover:bg-black text-white text-xs font-medium uppercase tracking-widest rounded-none transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:ring-offset-2"
                >
                    Sign In
                </button>
            </div>

        </form>

    </main>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            
            // Show sleek notification
            showToast(`Signing in as ${username}...`);
        }

        function showToast(message) {
            const existing = document.getElementById('toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 bg-neutral-900 text-white text-xs tracking-wide py-2.5 px-5 rounded-full shadow-xl transition-all duration-300 opacity-0 translate-y-2';
            toast.textContent = message;

            document.body.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
